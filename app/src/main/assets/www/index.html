<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Replay — carnet d’erreurs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f8f3; --sheet:#ffffff; --sheet2:#f3f4ee;
  --grid-minor:rgba(226,122,62,.10); --grid-major:rgba(226,122,62,.22);
  --ink:#16182a; --muted:#5b5f75; --rule:#dcdccf; --margin:#e9707a;
  --blue:#1d2fa0; --red:#d3302f; --green:#1d8a4e; --black:#16182a;
  --hl:#f2ff3d; --hl-ink:#16182a;
  --focus:#1d2fa0;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#11152a; --sheet:#181d36; --sheet2:#1f2542;
    --grid-minor:rgba(140,160,255,.05); --grid-major:rgba(140,160,255,.11);
    --ink:#eef0fa; --muted:#a2a8c6; --rule:#2c3356; --margin:#a8455a;
    --blue:#8ea2ff; --red:#ff6d64; --green:#4cd08a; --black:#eef0fa;
    --hl:#e9f73a; --focus:#8ea2ff;
  }
}
*{box-sizing:border-box}
html{
  min-height:100%;
  font:400 16.5px/1.5 "Bricolage Grotesque",system-ui,sans-serif;
  font-optical-sizing:auto;
  background-color:var(--paper);
  background-image:
    linear-gradient(to right,var(--grid-major) 1px,transparent 1px),
    linear-gradient(to bottom,var(--grid-major) 1px,transparent 1px),
    linear-gradient(to right,var(--grid-minor) 1px,transparent 1px),
    linear-gradient(to bottom,var(--grid-minor) 1px,transparent 1px);
  background-size:30px 30px,30px 30px,6px 6px,6px 6px;
}
body{margin:0;color:var(--ink);font:400 16.5px/1.5 "Bricolage Grotesque",system-ui,sans-serif;font-optical-sizing:auto;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.app{max-width:940px;margin:0 auto;padding:18px 20px 120px}

/* header */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 26px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:27px;letter-spacing:-.035em;font-variation-settings:"opsz" 96}
.logo svg{width:40px;height:40px;flex:none;display:block;color:var(--ink);overflow:visible}
.logo{flex:none;white-space:nowrap}
.status{font-size:13.5px;color:var(--muted);text-align:right;line-height:1.35}
.status b{color:var(--ink);font-weight:700}

/* type */
h1,h2,h3{margin:0;font-variation-settings:"opsz" 96;letter-spacing:-.025em;line-height:1.1}
h1{font-size:34px;font-weight:800}
h2{font-size:25px;font-weight:750;margin-bottom:12px}
h3{font-size:18px;font-weight:700;letter-spacing:-.01em;margin-bottom:10px}
.hand{font-family:Kalam,"Comic Sans MS",cursive;font-weight:700;letter-spacing:0}
.muted{color:var(--muted)} .small{font-size:14px}
a{color:var(--blue);font-weight:600}

/* sheets of paper: Seyès margin line on the left */
.card,.modal{
  position:relative;background:var(--sheet);border-radius:4px 14px 14px 4px;
  padding:20px 22px 20px 58px;margin-bottom:18px;
  box-shadow:0 1px 0 var(--rule),3px 4px 0 -1px var(--sheet2),3px 4px 0 0 var(--rule);
}
.card::before,.modal::before{content:"";position:absolute;top:0;bottom:0;left:38px;width:2px;background:var(--margin);opacity:.75}
.card.empty{text-align:center}
@media (max-width:640px){ .card,.modal{padding:16px 16px 16px 40px} .card::before,.modal::before{left:24px} }

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* buttons */
.btn{border:1.5px solid var(--ink);background:var(--sheet);border-radius:10px;padding:11px 18px;min-height:48px;cursor:pointer;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 3px 0 0 color-mix(in srgb,var(--blue) 55%,#000)}
@media (prefers-color-scheme: dark){ .btn.primary{color:#0e1230} }
.btn.primary:active{box-shadow:0 1px 0 0 color-mix(in srgb,var(--blue) 55%,#000);transform:translateY(2px)}
.btn.ghost{background:transparent;border-color:var(--rule)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.btn.small{min-height:38px;padding:6px 12px;font-size:14px;border-radius:8px}
.btn.big{min-height:60px;font-size:19px;padding:14px 30px;border-radius:12px}
.btn:disabled{opacity:.5;cursor:default}

/* chips: selected = highlighted, like a Stabilo pass */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--rule);background:var(--sheet);border-radius:999px;padding:8px 15px;min-height:42px;cursor:pointer;font-weight:500;font-size:15px}
.chip.on{background:var(--hl);border-color:var(--hl-ink);color:var(--hl-ink);font-weight:650}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--sheet2);color:var(--ink);border:1px solid var(--rule)}
.tag.grey{color:var(--muted)}
.tag.course::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--cc)}
.tag.course{border-color:color-mix(in srgb,var(--cc) 45%,transparent)}
.tag.hlt{background:var(--hl);color:var(--hl-ink);border-color:transparent}

/* forms */
label.f{display:block;font-weight:700;margin:22px 0 9px;font-size:16.5px}
label.f .muted{font-weight:400}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;border:1.5px solid var(--rule);background:var(--sheet);border-radius:10px;padding:12px 14px;min-height:48px}
input:focus,textarea:focus,select:focus{border-color:var(--blue);outline:none}
textarea{min-height:90px;resize:vertical}

/* bottom tabs, like notebook dividers */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:0 10px env(safe-area-inset-bottom);background:linear-gradient(to top,var(--paper) 60%,transparent)}
nav.bottom .inner{display:flex;gap:6px;max-width:940px;width:100%;align-items:flex-end}
nav.bottom button{flex:1;border:1.5px solid var(--rule);border-bottom:0;background:var(--sheet2);border-radius:12px 12px 0 0;padding:12px 4px 14px;cursor:pointer;color:var(--muted);font-size:14px;font-weight:650;transition:padding .15s}
nav.bottom button.on{background:var(--sheet);color:var(--ink);padding-top:18px;border-color:var(--ink)}
nav.bottom button.on span{color:var(--hl-ink);background:linear-gradient(transparent 55%,var(--hl) 55%,var(--hl) 92%,transparent 92%);padding:0 3px}
@media (max-width:560px){ nav.bottom button{font-size:12px;padding:10px 2px 12px} }

/* today hero: the one loud thing */
.hero{margin:6px 0 30px}
.hero-line{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.hero-num{font-family:Kalam,cursive;font-weight:700;font-size:150px;line-height:.9;color:var(--hl-ink)}
.hero-text{flex:1;min-width:240px}
.hero-text h1{font-size:40px;max-width:15ch}
.note{color:var(--blue);font-size:21px;margin:12px 0 0;transform:rotate(-1.5deg);transform-origin:left}
.hero-done{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.hero-done .hero-num{font-size:110px}
.hl{background-image:linear-gradient(100deg,transparent 2%,var(--hl) 4%,var(--hl) 95%,transparent 98%);background-repeat:no-repeat;background-size:100% 62%;background-position:0 72%;padding:0 .18em;border-radius:.2em .5em .3em .45em}
.swipe{animation:swipe .7s cubic-bezier(.3,.7,.2,1) .15s both}
@keyframes swipe{from{background-size:0% 62%}to{background-size:100% 62%}}
@media (prefers-reduced-motion:reduce){ .swipe{animation:none} .btn,nav.bottom button{transition:none} }

/* photo & ink */
.photo-btns{display:flex;gap:10px;flex-wrap:wrap}
.photo-preview img{max-width:100%;max-height:380px;border-radius:6px;display:block;margin-top:12px;background:#fff;border:1.5px solid var(--rule)}
.ink{position:relative;border:1.5px solid var(--rule);border-radius:8px;overflow:hidden;background:#fff}
.ink canvas{display:block;touch-action:none;cursor:crosshair}
.ink-hint{position:absolute;left:14px;top:9px;color:#8b8f9f;font-family:Kalam,cursive;font-size:17px;pointer-events:none}
.ink-tools{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.swatch{width:36px;height:36px;border-radius:50%;border:3px solid var(--sheet);box-shadow:0 0 0 1.5px var(--rule);cursor:pointer}
.swatch.on{box-shadow:0 0 0 2.5px var(--ink)}

/* review */
.problem-img{width:100%;max-height:70vh;object-fit:contain;border-radius:6px;background:#fff;cursor:zoom-in;display:block;border:1.5px solid var(--rule)}
.ptext{white-space:pre-wrap;font-size:18px;background:var(--sheet2);border-radius:8px;padding:14px 16px;margin-top:10px}
.instr{font-family:Kalam,cursive;font-size:19px;line-height:1.35;color:var(--blue);margin:16px 0;padding-left:14px;border-left:3px solid var(--hl)}
.instr b{font-weight:700}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.rate button{position:relative;border:0;border-radius:12px;padding:22px 6px 12px;min-height:88px;cursor:pointer;color:#fff;font-weight:750;font-size:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;overflow:hidden;transition:transform .08s}
.rate button:active{transform:translateY(2px)}
.rate button .click{position:absolute;top:0;left:50%;width:34%;height:9px;transform:translateX(-50%);border-radius:0 0 6px 6px;background:rgba(255,255,255,.55)}
.rate button small{font-size:16px;opacity:.95;font-weight:700}
.rate .again{background:var(--red)} .rate .hard{background:#16182a} .rate .good{background:var(--blue)} .rate .easy{background:var(--green)}
@media (prefers-color-scheme: dark){ .rate button{color:#0e1230} .rate .hard{background:#c9cde3} }
.progress{height:6px;background:var(--sheet2);border-radius:3px;overflow:hidden;margin:8px 0 18px}
.progress i{display:block;height:100%;background:var(--hl);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}

/* library */
.list .item{display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:6px 12px 12px 6px;background:var(--sheet);margin-bottom:10px;cursor:pointer;border:1.5px solid transparent;box-shadow:0 1px 0 var(--rule)}
.list .item:hover{border-color:var(--rule)}
.thumb{width:88px;height:66px;border-radius:5px;object-fit:cover;background:#fff;border:1px solid var(--rule);flex:none}
.thumb.txt{display:grid;place-items:center;font-size:12px;color:var(--muted);background:var(--sheet2);overflow:hidden;padding:4px;text-align:center}

/* stats */
.bar{height:14px;border-radius:3px;background:var(--sheet2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--hl);box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.barrow{display:grid;grid-template-columns:minmax(130px,230px) 1fr 46px;gap:12px;align-items:center;margin:9px 0;font-size:15px}
.spark{display:flex;align-items:flex-end;gap:5px;height:76px;border-bottom:1.5px solid var(--ink)}
.spark i{flex:1;background:var(--blue);border-radius:3px 3px 0 0;min-height:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
@media (max-width:680px){ .grid2{grid-template-columns:1fr} .rate{grid-template-columns:repeat(2,1fr)} .hero-num{font-size:110px} .hero-text h1{font-size:32px} }

/* layers */
.modal-back{position:fixed;inset:0;background:rgba(14,16,30,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:28px 12px}
.modal{max-width:780px;width:100%;margin:0}
.viewer{position:fixed;inset:0;background:#0d0f1a;z-index:60;overflow:auto}
.viewer img{display:block;margin:0 auto;background:#fff}
.viewer .close{position:fixed;top:12px;right:12px;z-index:61}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) rotate(-1deg);background:var(--hl);color:var(--hl-ink);padding:12px 20px;border-radius:6px;z-index:70;font-weight:700;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.toast.err{background:var(--red);color:#fff;transform:translateX(-50%)}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper b{min-width:38px;text-align:center;font-family:Kalam,cursive;font-size:26px}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--sheet);padding:10px 16px;min-height:44px;cursor:pointer;font-weight:650}
.seg button.on{background:var(--hl);color:var(--hl-ink)}
.empty{text-align:center;padding:26px 10px}
.empty .big{font-size:44px}
hr.sep{border:0;border-top:1.5px dashed var(--rule);margin:18px 0}
ol li{margin:4px 0}

/* --- Claude features --- */
.btn.ai{border:1.5px dashed var(--blue);color:var(--blue);background:var(--sheet)}
.btn.ai::before{content:"✦";font-size:14px}
.ai-panel{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.ai-live,.ai-out{white-space:pre-wrap;background:var(--sheet2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;padding:12px 14px;font-size:16.5px}
.ai-live.err{border-left-color:var(--red);color:var(--red)}
.ai-live.thinking{color:var(--muted);font-style:italic}
@media (prefers-reduced-motion:no-preference){ .ai-live.thinking{animation:pulse 1.4s ease-in-out infinite} }
@keyframes pulse{50%{opacity:.45}}
.ai-text{white-space:pre-wrap}
.hints{display:flex;flex-direction:column;gap:10px}
.hint{background:color-mix(in srgb,var(--hl) 35%,var(--sheet));border-radius:4px 10px 10px 4px;padding:10px 14px 12px;font-size:16.5px}
.hint-n{display:block;color:var(--blue);font-size:17px;margin-bottom:2px}
@media (prefers-color-scheme: dark){ .hint{background:color-mix(in srgb,var(--hl) 14%,var(--sheet))} }
/* fiche */
.fiche section{margin:16px 0}
.f-row{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:4px 16px;padding:10px 0;border-bottom:1.5px dashed var(--rule)}
.f-name{font-weight:700}
.f-math{font-size:18px;overflow-x:auto}
.f-when{grid-column:2}
@media (max-width:600px){ .f-row{grid-template-columns:1fr} .f-when{grid-column:1} }
.fiche li{margin:5px 0}
/* tools */
.result{margin-top:12px;padding:14px 16px;border-radius:8px;background:var(--sheet2);font-size:16.5px}
.result.ok{border-left:4px solid var(--green)}
.result.bad{border-left:4px solid var(--red)}
.result.warn{border-left:4px solid #d8a01c}
.res-big{font-size:22px;font-weight:750;letter-spacing:-.01em;margin-bottom:4px}
.uvars{display:flex;flex-direction:column;gap:8px}
.uv-head,.uv-row{display:grid;grid-template-columns:90px 1fr 1fr;gap:10px;align-items:center}
.uv-head{font-size:13.5px;color:var(--muted);font-weight:600}
.uv-name{font-size:20px;font-family:Kalam,cursive}
details>summary{cursor:pointer;font-weight:700;font-size:17px}
.plot{margin-top:16px}
.plot svg{width:100%;height:auto;display:block;background:#fff;border:1.5px solid var(--rule);border-radius:8px}
.p-grid{stroke:rgba(226,122,62,.22);stroke-width:1}
.p-axis{stroke:#16182a;stroke-width:1.5}
.p-tick{font:12px "Bricolage Grotesque",sans-serif;fill:#5b5f75}
.p-label{font:600 14px "Bricolage Grotesque",sans-serif;fill:#16182a}
.p-fit{stroke:#1d2fa0;stroke-width:2.5}
.p-err{stroke:#16182a;stroke-width:1.4}
.p-pt{fill:#d3302f;stroke:#fff;stroke-width:1.5}
/* tasks */
.task{display:flex;gap:14px;align-items:center;padding:10px 0;border-bottom:1.5px dashed var(--rule)}
.task:last-child{border-bottom:0}
.task-title{font-weight:650;font-size:17px}
.task.done .task-title{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px;color:var(--muted)}
.task-due{font-size:18px;color:var(--blue);white-space:nowrap}
.task.late .task-due{color:var(--red)}
input.tick{appearance:none;-webkit-appearance:none;width:30px;height:30px;border:2px solid var(--ink);border-radius:7px;background:var(--sheet);cursor:pointer;flex:none;display:grid;place-items:center;margin:0}
input.tick:checked{background:var(--hl);}
input.tick:checked::after{content:"✓";font-family:Kalam,cursive;font-weight:700;font-size:22px;color:var(--hl-ink);line-height:1}
.gear{min-height:40px}
/* --- game --- */
.ruler{position:relative;height:16px;border:1.5px solid var(--ink);border-radius:3px;background:var(--sheet);overflow:hidden}
.ruler>i{position:absolute;left:0;top:0;bottom:0;background:var(--fill,var(--hl));transition:width .5s cubic-bezier(.3,.7,.2,1)}
.ruler::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to right,transparent 0 9px,rgba(22,24,42,.28) 9px 10px),repeating-linear-gradient(to right,transparent 0 49px,rgba(22,24,42,.5) 49px 50px);background-size:auto 45%,auto 75%;background-repeat:repeat-x;background-position:0 0,0 0;pointer-events:none}
@media (prefers-color-scheme: dark){ .ruler::after{background:repeating-linear-gradient(to right,transparent 0 9px,rgba(238,240,250,.25) 9px 10px),repeating-linear-gradient(to right,transparent 0 49px,rgba(238,240,250,.45) 49px 50px);background-size:auto 45%,auto 75%;background-repeat:repeat-x} }
.char-top{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.char-lvl{font-size:84px;line-height:.9;color:var(--hl-ink)}
.char-rank{font-size:38px;font-weight:800;letter-spacing:-.035em;line-height:1.05;font-variation-settings:"opsz" 96}
.char-streak{text-align:center;padding:6px 14px;border:1.5px dashed var(--red);border-radius:10px;transform:rotate(2deg)}
.char-streak .hand{font-size:34px;line-height:1;color:var(--red)}
.stats-list{display:flex;flex-direction:column;gap:12px}
.stat-row{display:grid;grid-template-columns:minmax(150px,290px) 64px 1fr 70px;gap:12px;align-items:center}
.stat-lv{font-size:19px;color:var(--blue)}
.stat-xp{text-align:right}
@media (max-width:640px){ .stat-row{grid-template-columns:1fr 60px} .stat-row .ruler{grid-column:1/-1} .stat-xp{display:none} }
.quests{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.quest{display:flex;gap:12px;align-items:center}
.q-box{width:28px;height:28px;border:2px solid var(--ink);border-radius:6px;display:grid;place-items:center;font-family:Kalam,cursive;font-weight:700;font-size:20px;flex:none}
.quest.done .q-box{background:var(--hl);color:var(--hl-ink)}
.quest.done .q-label{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px;color:var(--muted)}
.q-label{font-weight:600;margin-bottom:4px}
.q-count{font-size:18px;color:var(--blue);white-space:nowrap}
.quest.done .q-count{color:var(--green)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:18px 12px;margin-top:16px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.stamp{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;padding:12px;font-weight:800;font-size:14px;line-height:1.15;letter-spacing:-.01em;border:2px dashed var(--rule);color:var(--muted);transform:rotate(var(--rot,0deg))}
.stamp span{display:block}
.badge.on .stamp{border:3.5px double var(--red);color:var(--red);background:color-mix(in srgb,var(--red) 6%,var(--sheet));box-shadow:inset 0 0 0 4px var(--sheet),inset 0 0 0 5.5px color-mix(in srgb,var(--red) 55%,transparent)}
.badge:not(.on) .stamp span{font-family:Kalam,cursive;font-size:30px}
.b-desc{max-width:140px;line-height:1.3}
.lvl-strip{display:flex;gap:14px;align-items:center;text-decoration:none;color:var(--ink);font-weight:400;margin:-8px 0 18px;padding:8px 2px}
.lvl-n{font-size:34px;line-height:1;color:var(--hl-ink)}
.lvl-strip .ruler{height:12px;margin-top:5px}
.celebrate{position:fixed;left:50%;top:16%;z-index:80;transform:translateX(-50%) rotate(-1.5deg);background:var(--sheet);border:2px solid var(--ink);border-left:10px solid var(--cc,var(--blue));border-radius:6px 14px 14px 6px;padding:18px 26px;box-shadow:0 14px 40px rgba(0,0,0,.22);text-align:center;max-width:90vw}
.cb-big{font-size:32px;font-weight:800;letter-spacing:-.03em;color:var(--hl-ink)}
@media (prefers-color-scheme: dark){ .cb-big{color:var(--ink)} .cb-big .hl{color:var(--hl-ink)} }
.cb-small{font-size:20px;color:var(--blue);margin-top:4px}
@media (prefers-reduced-motion:no-preference){ .celebrate{animation:pop .45s cubic-bezier(.2,1.4,.4,1) both} .celebrate.out{animation:fade .4s ease forwards} }

    <div class="row" style="gap:12px;flex-wrap:nowrap"><div class="status" id="status">Chargement…</div><button class="btn small ghost gear" id="gear" type="button">Réglages</button></div>

<script>
'use strict';
/* ---------- helpers ---------- */
function el(tag, props, ...kids){
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(props||{})){
    if (v==null || v===false) continue;
    if (k==='class') n.className = v;
    else if (k==='text') n.textContent = v;
    else if (k.startsWith('on') && typeof v==='function') n.addEventListener(k.slice(2), v);
    else if (k==='style' && typeof v==='object') Object.assign(n.style, v);
    else if (v===true) n.setAttribute(k,'');
    else n.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)){
    if (c==null || c===false) continue;
    n.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return n;
}
const pl=(n,w)=>n+' '+w+(n===1?'':'s');
const clone = o => JSON.parse(JSON.stringify(o));
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const uid = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function today(){ return ymd(new Date()); }
function parseYmd(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(s,n){ const d=parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
function diffDays(a,b){ return Math.round((parseYmd(b)-parseYmd(a))/86400000); }
function fmtInterval(n){ if(n<=1) return 'demain'; if(n<30) return n+' jours'; if(n<60) return '~1 mois'; return '~'+Math.round(n/30)+' mois'; }
function fmtDue(s){ const d=diffDays(today(),s); if(d<0) return 'en attente'; if(d===0) return 'aujourd’hui'; if(d===1) return 'demain'; return 'dans '+d+' jours'; }
function fmtDate(s){ return parseYmd(s).toLocaleDateString('fr-CH',{day:'numeric',month:'short'}); }

/* ---------- static data ---------- */
const DEFAULT_COURSES = {
  'Mécanique I': ['Cinématique','Lois de Newton','Bilan des forces','Frottement','Travail & énergie','Quantité de mouvement & chocs','Mouvement circulaire','Rotation & moment de force','Moment cinétique','Oscillations','Gravitation & Kepler','Référentiels'],
  'Thermodynamique I': ['Température & équilibre','Gaz parfait','Théorie cinétique','Chaleur & calorimétrie','Premier principe','Travail & diagrammes PV','Transformations adiabatiques','Moteurs & cycles','Second principe & entropie','Changements de phase','Transferts thermiques'],
  'Algèbre': ['Logique & ensembles','Nombres complexes','Systèmes linéaires','Matrices','Déterminants','Espaces vectoriels','Bases & dimension','Applications linéaires','Valeurs & vecteurs propres','Diagonalisation','Produit scalaire & orthogonalité'],
  'Analyse': ['Suites','Limites & continuité','Dérivées','Développements de Taylor','Intégrales','Techniques d’intégration','Séries numériques','Séries entières','Fonctions de plusieurs variables','Équations différentielles'],
  'Méthodes mathématiques pour la physique': ['Calcul vectoriel','Coordonnées polaires, cylindriques, sphériques','Gradient, divergence, rotationnel','Intégrales multiples','Intégrales de ligne & de surface','Équations différentielles','Nombres complexes en physique','Séries de Fourier','Analyse dimensionnelle','Approximations & développements']
};
const COURSE_ALIASES = {'Mechanics I':'Mécanique I','Thermodynamics I':'Thermodynamique I'};
const fixCourse = c => COURSE_ALIASES[c] || c;
const REASONS = [
  {id:'start',   label:'Je ne savais pas par où commencer'},
  {id:'setup',   label:'Mauvaise mise en place (schéma, système, méthode)'},
  {id:'concept', label:'Notion mal comprise'},
  {id:'algebra', label:'Erreur de calcul'},
  {id:'sign',    label:'Erreur de signe ou d’unités'},
  {id:'other',   label:'Autre'}
];
const REASON_LABEL = Object.fromEntries(REASONS.map(r=>[r.id,r.label]));
const DEFAULT_SETTINGS = { dailyLimit:1, examLimit:3, boostDays:7, reviewMode:'quick', penOnly:true, customTopics:{}, extraCourses:[], exams:[] };
const LS_KEY = 'replay-notebook-v1';

/* ---------- state ---------- */
const S = { mode:'loading', db:null, assets:null, uid:null, settingsRef:null, col:null,
  problems:new Map(), settings:clone(DEFAULT_SETTINGS), loaded:false, stale:false,
  view:'today', session:null, libFilter:'all' };

function courses(){ return Object.keys(DEFAULT_COURSES).concat(S.settings.extraCourses||[]); }
const COURSE_COLORS = {'Mécanique I':'#2443b5','Thermodynamique I':'#d9541e','Algèbre':'#7a3fc4','Analyse':'#1d8a4e','Méthodes mathématiques pour la physique':'#0e8a9c'};
const courseColor = c => COURSE_COLORS[c] || '#5d6177';
const COURSE_SHORT={'Méthodes mathématiques pour la physique':'Méthodes math.'};
const shortCourse=c=>COURSE_SHORT[c]||c;
const courseOpts=()=>courses().map(c=>({id:c,label:shortCourse(c)}));
function courseTag(c){ const n=el('span',{class:'tag course',text:shortCourse(c),title:c}); n.style.setProperty('--cc',courseColor(c)); return n; }
const topicsOf = p => (p.topics && p.topics.length) ? p.topics : (p.topic ? [p.topic] : []);
function topicsFor(c){ return (DEFAULT_COURSES[c]||[]).concat((S.settings.customTopics||{})[c]||[]); }
function allProblems(){ return [...S.problems.values()]; }
function activeProblems(){ return allProblems().filter(p=>!p.archived); }

/* ---------- storage ---------- */
async function init(){
  render();
  document.getElementById('gear').addEventListener('click',()=>go('settings'));
  initAI();
  nbInit().then(()=>refresh());
  const api = (window.claude && typeof window.claude.use==='function') ? window.claude : null;
  if (api){
    try{
      const [db,user,assets] = await Promise.all([
        api.use('db'), api.use('user'), api.use('assets').catch(()=>null)
      ]);
      const id = user ? await user.id() : null;
      if (db && id){ startCloud(db, id, assets); return; }
    }catch(e){ console.warn('capabilities', e); }
  }
  startLocal();
}
function startCloud(db, id, assets){
  S.mode='cloud'; S.db=db; S.uid=id; S.assets=assets;
  S.settingsRef = db.doc('data/users/'+id+'/settings');
  S.col = S.settingsRef.collection('problems');
  let hadS=false, hadP=false, okS=false, okP=false;
  const timer = setTimeout(()=>{ if(!(okS&&okP)){ S.stale=true; S.loaded=true; refresh(); } }, 10000);
  const after = ()=>{
    if (hadS && hadP) S.loaded = true;
    if (okS && okP){ clearTimeout(timer); S.stale=false; }
    refresh();
  };
  S.settingsRef.onSnapshot(snap=>{
    if (snap.exists){ S.settings = Object.assign(clone(DEFAULT_SETTINGS), clone(snap.data())); (S.settings.exams||[]).forEach(e=>e.course=fixCourse(e.course)); }
    hadS = true; if(!snap.metadata.fromCache) okS = true; after();
  }, err=>{ console.warn(err); hadS=okS=true; after(); });
  S.col.onSnapshot(snap=>{
    const m = new Map();
    snap.docs.forEach(d=>{ if(d.exists) { const o=Object.assign(clone(d.data()), {id:d.id}); o.course=fixCourse(o.course); o.topics=topicsOf(o); m.set(d.id,o); } });
    S.problems = m; hadP = true; if(!snap.metadata.fromCache) okP = true; after();
  }, err=>{ console.warn(err); hadP=okP=true; toast('Impossible de charger tes problèmes ('+(err&&err.code||'error')+').','err'); after(); });
}
const IMG_URLS=new Map();
function idbOpen(){ return new Promise((res,rej)=>{ const r=indexedDB.open('replay-images',1); r.onupgradeneeded=()=>r.result.createObjectStore('img'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbPut(key,blob){ const db=await idbOpen(); return new Promise((res,rej)=>{ const tx=db.transaction('img','readwrite'); tx.objectStore('img').put(blob,key); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
async function idbDel(key){ const db=await idbOpen(); return new Promise(res=>{ const tx=db.transaction('img','readwrite'); tx.objectStore('img').delete(key); tx.oncomplete=()=>res(); tx.onerror=()=>res(); }); }
async function idbAll(){ const db=await idbOpen(); return new Promise((res,rej)=>{ const out=[]; const rq=db.transaction('img').objectStore('img').openCursor(); rq.onsuccess=()=>{ const c=rq.result; if(c){ out.push([c.key,c.value]); c.continue(); } else res(out); }; rq.onerror=()=>rej(rq.error); }); }
async function startLocal(){
  try{ for(const [k,b] of await idbAll()) IMG_URLS.set(k, URL.createObjectURL(b)); }catch(e){ console.warn('idb',e); }
  S.mode='local';
  try{
    const raw = localStorage.getItem(LS_KEY);
    if (raw){ const o = JSON.parse(raw);
      S.settings = Object.assign(clone(DEFAULT_SETTINGS), o.settings||{});
      S.problems = new Map(Object.entries(o.problems||{}).map(([k,v])=>{ v.course=fixCourse(v.course); v.topics=topicsOf(v); return [k,v]; })); }
  }catch(e){ S.mode='memory'; }
  S.loaded = true; render();
}
function persistLocal(){
  if (S.mode!=='local') return S.mode==='memory';
  try{ localStorage.setItem(LS_KEY, JSON.stringify({settings:S.settings, problems:Object.fromEntries(S.problems)})); return true; }
  catch(e){ toast('Impossible d’enregistrer sur cet appareil (stockage plein ou bloqué).','err'); return false; }
}
const chains = {};
function queued(key, fn){
  const run = async ()=>{ try{ return await fn(); }catch(e){ if(e && e.code==='unavailable'){ await sleep(400+Math.random()*600); return fn(); } throw e; } };
  const next = (chains[key]||Promise.resolve()).catch(()=>{}).then(run);
  chains[key] = next; return next;
}
function dbFail(e){
  const c = e && e.code;
  if (c==='quota_exceeded') toast('Stockage plein — supprime ou archive quelques anciens problèmes.','err');
  else if (c==='invalid_argument') toast('Ce problème est trop lourd (essaie une photo plus petite).','err');
  else toast('Enregistrement impossible pour le moment ('+(c||'erreur')+'). Vérifie ta connexion.','err');
  return false;
}
async function saveSettings(){
  if (S.mode==='cloud'){ const data = clone(S.settings); return queued('settings', ()=>S.settingsRef.set(data)).then(()=>true, dbFail); }
  return persistLocal();
}
async function saveProblem(p){
  S.problems.set(p.id, p);
  if (S.mode==='cloud'){ const data = clone(p); return queued(p.id, ()=>S.col.doc(p.id).set(data)).then(()=>true, dbFail); }
  return persistLocal();
}
async function removeProblem(p){
  S.problems.delete(p.id);
  if (S.mode==='cloud'){
    const ok = await queued(p.id, ()=>S.col.doc(p.id).delete()).then(()=>true, dbFail);
    if (ok && S.assets) for (const k of ['problemImg','solutionImg','noteImg'])
      if (p[k] && !p[k].startsWith('data:')) S.assets.delete(p[k]).catch(()=>{});
    return ok;
  }
  for (const k of ['problemImg','solutionImg','noteImg']) if (p[k] && p[k].startsWith('idb:')){ idbDel(p[k]); IMG_URLS.delete(p[k]); }
  return persistLocal();
}

/* ---------- images ---------- */
function loadImage(blob){
  return new Promise((res,rej)=>{ const u=URL.createObjectURL(blob); const i=new Image();
    i.onload=()=>{ URL.revokeObjectURL(u); res(i); }; i.onerror=e=>{ URL.revokeObjectURL(u); rej(e); }; i.src=u; });
}
async function recompress(blob, max, q, type){
  const img = await loadImage(blob);
  let w=img.naturalWidth, h=img.naturalHeight; const sc=Math.min(1, max/Math.max(w,h));
  w=Math.max(1,Math.round(w*sc)); h=Math.max(1,Math.round(h*sc));
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h);
  return await new Promise(r=>c.toBlob(r, type||'image/jpeg', q));
}
function blobToDataURL(b){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(b); }); }
async function storeImage(blob){
  if (!blob) return null;
  if (S.mode==='cloud' && S.assets){
    for (let a=0;a<2;a++){
      try{ const r = await S.assets.upload(blob, {type: blob.type || 'image/jpeg'}); return r.id; }
      catch(e){ console.warn('upload', e); if(!(e && e.code==='store_unavailable') || a) break; await sleep(800); }
    }
  }
  if (S.mode==='local'){ try{ const key='idb:'+uid(); await idbPut(key, blob); IMG_URLS.set(key, URL.createObjectURL(blob)); return key; }catch(e){ console.warn('idb put',e); } }
  const small = await recompress(blob, S.mode==='cloud'?1100:1000, 0.62, 'image/jpeg');
  return await blobToDataURL(small);
}
const imgSrc = ref => ref ? (ref.startsWith('data:') ? ref : ref.startsWith('idb:') ? (IMG_URLS.get(ref)||'') : '/_blob/'+ref) : null;

let mjPromise = null;
function ensureMathJax(){
  if (mjPromise) return mjPromise;
  window.MathJax = { tex:{inlineMath:[['$','$'],['\\(','\\)']]}, svg:{fontCache:'global'}, startup:{typeset:false} };
  mjPromise = new Promise(res=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js'; s.async=true; s.onload=()=>res(true); s.onerror=()=>res(false); document.head.append(s); });
  return mjPromise;
}
function mathText(str, cls){

  if (/\$|\\\(/.test(str)) ensureMathJax().then(ok=>{ if(ok && window.MathJax && MathJax.typesetPromise) MathJax.startup.promise.then(()=>MathJax.typesetPromise([n])).catch(()=>{}); });

}

/* ---------- spaced repetition ---------- */
function newSrs(){ return {ease:2.3, interval:0, reps:0, lapses:0, due:addDays(today(),1), last:null}; }
function schedule(p, rating){
  const s = p.srs || newSrs(); const t = today();
  let ease=s.ease||2.3, iv=s.interval||0, reps=s.reps||0, lapses=s.lapses||0;
  if (rating==='again'){ lapses++; reps=0; iv=1; ease=Math.max(1.3, ease-0.2); }
  else if (rating==='hard'){ iv = reps===0 ? 1 : Math.max(1, Math.round(iv*1.2)); ease=Math.max(1.3, ease-0.15); reps++; }
  else if (rating==='good'){ iv = reps===0 ? 3 : Math.max(iv+1, Math.round(iv*ease)); reps++; }
  else if (rating==='easy'){ iv = reps===0 ? 5 : Math.max(iv+2, Math.round(iv*ease*1.3)); ease=Math.min(3, ease+0.15); reps++; }
  iv = Math.min(iv, 180);
  return {ease:Math.round(ease*100)/100, interval:iv, reps, lapses, due:addDays(t,iv), last:t};
}
function upcomingExams(withinDays){
  const t=today();
  return (S.settings.exams||[]).filter(e=>e.date>=t && diffDays(t,e.date)<=withinDays).sort((a,b)=>a.date<b.date?-1:1);
}
function examMatches(ex, p){ return p.course===ex.course && (!ex.topics || !ex.topics.length || topicsOf(p).some(t=>ex.topics.includes(t))); }
function boostActive(){ return upcomingExams(S.settings.boostDays||7).length>0; }
function dailyLimit(){ return boostActive() ? Math.max(S.settings.examLimit||3, S.settings.dailyLimit||1) : (S.settings.dailyLimit||1); }
function reviewedToday(){ const t=today(); let n=0; for(const p of S.problems.values()) for(const h of (p.history||[])) if(h.d===t) n++; return n; }
function backlog(){
  const t=today(); const exams=upcomingExams(14);
  const items=[];
  for (const p of activeProblems()){
    const s=p.srs||newSrs();
    const ex = exams.find(e=>examMatches(e,p));
    let due = s.due<=t;
    if (!due && ex){ const start=addDays(ex.date,-14); if(s.due>ex.date && (!s.last || s.last<start)) due=true; }
    if (s.last===t) due=false; // never twice in one day automatically
    if (due) items.push({p, ex:!!ex, due:s.due, lapses:s.lapses||0});
  }
  items.sort((a,b)=> (b.ex-a.ex) || (a.due<b.due?-1:a.due>b.due?1:0) || (b.lapses-a.lapses));
  return items.map(i=>i.p);
}
function todayQueue(){ const left=Math.max(0, dailyLimit()-reviewedToday()); return backlog().slice(0,left); }
function streak(){
  const days=new Set(); for(const p of S.problems.values()){ if(p.created) days.add(p.created); for(const h of (p.history||[])) days.add(h.d); } for(const x of (S.settings.tasks||[])) if(x.done&&x.doneAt) days.add(x.doneAt);
  let d=today(); if(!days.has(d)) d=addDays(d,-1); let n=0; while(days.has(d)){ n++; d=addDays(d,-1); } return n;
}

function Chips(options, selected, {multi=false, onchange, extra}={}){
  const box=el('div',{class:'chips'}); let sel = multi ? new Set(selected||[]) : selected;
  function draw(){
    box.replaceChildren(...options.map(o=>{
      const id=typeof o==='string'?o:o.id, label=typeof o==='string'?o:o.label;
      const on = multi ? sel.has(id) : sel===id;
      return el('button',{type:'button',class:'chip'+(on?' on':''), text:label, onclick:()=>{
        if (multi){ sel.has(id)?sel.delete(id):sel.add(id); } else sel = (sel===id?null:id);
        draw(); onchange && onchange(multi?[...sel]:sel);
      }});
    }), extra||[]);
  }
  draw(); return {el:box, get:()=> multi?[...sel]:sel, set:v=>{ sel = multi?new Set(v):v; draw(); }};
}

function InkPad({height=220, hint='Écris avec ton stylet…'}={}){
  const wrap=el('div',{class:'ink'}); const canvas=el('canvas'); const ph=el('div',{class:'ink-hint',text:hint});
  wrap.append(canvas, ph);
  const ctx=canvas.getContext('2d'); const strokes=[]; let cur=null, activeId=null, penSeen=false, color='#1d2fa0';
  let W=0, H=height, dpr=1;
  const width = p => 2.3*(0.35 + (p||0.5)*1.3);
  function paper(){ ctx.setTransform(dpr,0,0,dpr,0,0); ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='#dbe3f3'; ctx.lineWidth=1; for(let y=34;y<H;y+=34){ ctx.beginPath(); ctx.moveTo(0,y+.5); ctx.lineTo(W,y+.5); ctx.stroke(); } }
  function seg(a,b,c){ ctx.strokeStyle=c; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=width((a[2]+b[2])/2); ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); }
  function dotAt(a,c){ ctx.fillStyle=c; ctx.beginPath(); ctx.arc(a[0],a[1],width(a[2])/2,0,Math.PI*2); ctx.fill(); }
  function drawStroke(s){ if(s.pts.length===1) dotAt(s.pts[0],s.color); for(let i=1;i<s.pts.length;i++) seg(s.pts[i-1],s.pts[i],s.color); }
  function redraw(){ paper(); strokes.forEach(drawStroke); ph.style.display=strokes.length?'none':''; }
  function size(){ const w=wrap.clientWidth; if(!w || w===W) return; W=w; dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr); canvas.style.width=W+'px'; canvas.style.height=H+'px'; redraw(); }
  if (window.ResizeObserver) new ResizeObserver(size).observe(wrap); requestAnimationFrame(size);
  const pos = e => { const r=canvas.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top, e.pressure||0.5]; };
  canvas.addEventListener('pointerdown', e=>{
    if (e.pointerType==='pen') penSeen=true;
    if (S.settings.penOnly && penSeen && e.pointerType==='touch') return;
    if (activeId!==null) return;
    activeId=e.pointerId; try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
    cur={color, pts:[pos(e)]}; strokes.push(cur); dotAt(cur.pts[0],color); ph.style.display='none'; e.preventDefault();
  });
  canvas.addEventListener('pointermove', e=>{
    if (e.pointerId!==activeId || !cur) return;
    const evs = (e.getCoalescedEvents && e.getCoalescedEvents().length) ? e.getCoalescedEvents() : [e];
    for (const ev of evs){ const p=pos(ev); const last=cur.pts[cur.pts.length-1]; if(Math.abs(p[0]-last[0])+Math.abs(p[1]-last[1])<0.6) continue; cur.pts.push(p); seg(last,p,cur.color); }
    e.preventDefault();
  });
  const end = e=>{ if(e.pointerId!==activeId) return; activeId=null; cur=null; };
  canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);
  const sw = [];
  const tools=el('div',{class:'ink-tools'},
    ...[['#1d2fa0','Bleu'],['#16182a','Noir'],['#d3302f','Rouge'],['#1d8a4e','Vert']].map(([c,n])=>{ const b=el('button',{type:'button',class:'swatch'+(c===color?' on':''),title:n,style:{background:c},onclick:()=>{ color=c; sw.forEach(x=>x.classList.toggle('on',x===b)); }}); sw.push(b); return b; }),
    el('span',{class:'spacer'}),
    el('button',{type:'button',class:'btn small',text:'↶ Annuler le trait',onclick:()=>{ strokes.pop(); redraw(); }}),
    el('button',{type:'button',class:'btn small ghost',text:'Effacer',onclick:()=>{ strokes.length=0; redraw(); }}));
  const root=el('div',{}, wrap, tools);
  return {el:root, isEmpty:()=>!strokes.length,
    toBlob:()=>new Promise(r=>canvas.toBlob(r,'image/png')),
    clear:()=>{ strokes.length=0; redraw(); }};
}

function viewReview(){

    : el('span',{}, el('b',{text:'Mode complet : '}), 'résous tout, puis compare.')));
  // scratch pad
  const scratchHolder=el('div');
  const scratchBtn=el('button',{class:'btn small',text:'✎ Brouillon',onclick:()=>{ const pad=InkPad({height:quick?320:520, hint:'Fais tes calculs ici (non enregistré)…'}); scratchHolder.replaceChildren(pad.el, verifyBox(p,pad)||''); scratchBtn.remove(); }});
  card.append(el('div',{class:'row'}, scratchBtn), scratchHolder);
  if (!s.revealed){ const hb=hintBox(p,s); if(hb) card.append(hb); }
  root.append(card);

  if (!s.revealed){
    root.append(el('div',{class:'row',style:{justifyContent:'center'}}, el('button',{class:'btn primary big',text:'Voir la solution',onclick:()=>{ s.revealed=true; render(); }})));
  } else {

    if (!p.solutionImg && !p.solutionText) sol.append(el('p',{class:'muted',text:'Pas de solution enregistrée — compare avec ton corrigé.'}));
    if ((p.reasons||[]).length || p.noteImg || p.noteText){

/* ---------- Stats ---------- */
function viewStats(){
  const root=el('div'); root.append(el('h2',{text:'Ton profil d’erreurs'}));
  const probs=allProblems();
  if (!probs.length){ root.append(el('div',{class:'card empty muted',text:'Ajoute quelques problèmes et tes tendances apparaîtront ici.'})); return root; }
  // reviews per day (14 days)
  const days=[]; for(let i=13;i>=0;i--) days.push(addDays(today(),-i));
  const perDay=Object.fromEntries(days.map(d=>[d,0])); let totalRev=0, okRev=0;
  for (const p of probs) for (const h of (p.history||[])){ totalRev++; if(h.r==='good'||h.r==='easy') okRev++; if(h.d in perDay) perDay[h.d]++; }
  const mx=Math.max(1,...Object.values(perDay));
  root.append(el('div',{class:'grid2'},
    el('div',{class:'card'}, el('h3',{text:'Révisions, 14 derniers jours'}), el('div',{class:'spark'}, days.map(d=>el('i',{title:fmtDate(d)+': '+perDay[d],style:{height:(perDay[d]/mx*100)+'%'}})))),
    el('div',{class:'card'}, el('h3',{text:'Global'}),
      el('div',{}, (()=>{const a=probs.filter(p=>!p.archived).length,m=probs.filter(p=>p.archived).length; return [el('b',{text:String(a)}),' actif'+(a===1?'':'s')+' · ', el('b',{text:String(m)}),' maîtrisé'+(m===1?'':'s')];})()),
      el('div',{}, el('b',{text:String(totalRev)}),' révision'+(totalRev===1?'':'s')+' · ', el('b',{text: totalRev? Math.round(okRev/totalRev*100)+'%':'—'}),' réussi'+(totalRev===1?'e':'es')),
      el('div',{}, (()=>{const n=streak(); return [el('b',{text:String(n)}),' jour'+(n===1?'':'s')+' d’affilée'];})()))));
  for (const c of courses()){
    const cp=probs.filter(p=>p.course===c); if(!cp.length) continue;
    const rc={}; let tagged=0; for(const p of cp) for(const r of (p.reasons||[])){ rc[r]=(rc[r]||0)+1; tagged++; }
    const card=el('div',{class:'card'}, el('h3',{text:c+' — pourquoi tu rates'}));
    if (!tagged) card.append(el('p',{class:'muted small',text:'Aucune raison indiquée pour l’instant.'}));
    REASONS.filter(r=>rc[r.id]).sort((a,b)=>rc[b.id]-rc[a.id]).forEach(r=>{
      const pct=Math.round(rc[r.id]/tagged*100);
      card.append(el('div',{class:'barrow'}, el('span',{text:r.label}), el('div',{class:'bar'}, el('i',{style:{width:pct+'%'}})), el('span',{class:'small',text:pct+'%'})));
    });
    const top=REASONS.filter(r=>rc[r.id]).sort((a,b)=>rc[b.id]-rc[a.id])[0];
    if (top && tagged>=3) card.append(el('p',{class:'small',style:{marginTop:'10px'}}, el('b',{text:'À travailler : '}), ADVICE[top.id]));
    // weak topics
    const tp={}; for(const p of cp){ const ts=topicsOf(p).length?topicsOf(p):['Sans thème']; for(const t of ts){ tp[t]=tp[t]||{n:0,again:0,rev:0}; tp[t].n++; for(const h of (p.history||[])){ tp[t].rev++; if(h.r==='again') tp[t].again++; } } }
    const rows=Object.entries(tp).sort((a,b)=>(b[1].n+b[1].again*2)-(a[1].n+a[1].again*2)).slice(0,6);
    card.append(el('hr',{class:'sep'}), el('h3',{text:'Thèmes les plus faibles'}));
    rows.forEach(([t,v])=>card.append(el('div',{class:'row small',style:{justifyContent:'space-between',padding:'4px 0'}}, el('span',{text:t}),
      el('span',{class:'muted',text: v.n+' problème'+(v.n===1?'':'s')+(v.rev?' · '+Math.round(v.again/v.rev*100)+'% “à revoir”':'')}))));
    root.append(card);
  }
  return root;
}

/* returns {blobs, note} with a description of each attached image in order */
async function problemImages(p, withSolution){

/* ================= expression parser (units + uncertainties) ================= */
const FUNCS=['sin','cos','tan','asin','acos','atan','sinh','cosh','tanh','exp','ln','log','sqrt','abs','arcsin','arccos','arctan'];
const CONSTS={pi:Math.PI,'π':Math.PI};
function tokenize(src){
  const s=src.replace(/\*\*/g,'^').replace(/[×·⋅]/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/²/g,'^2').replace(/³/g,'^3').replace(/√/g,'sqrt');
  const toks=[]; let i=0;
  const idRe=/^[A-Za-zΑ-Ωα-ωµΩ_][A-Za-z0-9Α-Ωα-ωµΩ_']*/;
  const numRe=/^(\d+[.,]?\d*|[.,]\d+)([eE][+-]?\d+)?/;
  while(i<s.length){
    const c=s[i];
    if(/\s/.test(c)){ i++; continue; }
    let m;
    if((m=numRe.exec(s.slice(i)))){ toks.push({t:'num',v:parseFloat(m[0].replace(',','.')),s:m[0]}); i+=m[0].length; continue; }
    if((m=idRe.exec(s.slice(i)))){ toks.push({t:'id',v:m[0]}); i+=m[0].length; continue; }
    if('+-*/^()='.includes(c)){ toks.push({t:c}); i++; continue; }
    throw {msg:'Caractère inattendu : « '+c+' »'};
  }
  return toks;
}
function parseExpr(src){
  const toks=tokenize(src); let k=0;
  const peek=()=>toks[k], next=()=>toks[k++];
  const expect=t=>{ const x=next(); if(!x||x.t!==t) throw {msg:'« '+t+' » attendu'}; };
  function expr(){ let a=term(); while(peek()&&(peek().t==='+'||peek().t==='-')){ const op=next().t; a={t:'bin',op,a,b:term()}; } return a; }
  function term(){ let a=unary();
    for(;;){ const p=peek(); if(!p) break;
      if(p.t==='*'||p.t==='/'){ next(); a={t:'bin',op:p.t,a,b:unary()}; }
      else if(p.t==='num'||p.t==='id'||p.t==='('){ a={t:'bin',op:'*',a,b:power(),imp:true}; }
      else break; }
    return a; }
  function unary(){ const p=peek(); if(p&&(p.t==='-'||p.t==='+')){ next(); const a=unary(); return p.t==='-'?{t:'neg',a}:a; } return power(); }
  function power(){ const a=atom(); if(peek()&&peek().t==='^'){ next(); return {t:'pow',a,b:unary()}; } return a; }
  function atom(){ const p=next(); if(!p) throw {msg:'Expression incomplète'};
    if(p.t==='num') return {t:'num',v:p.v};
    if(p.t==='id'){ if(FUNCS.includes(p.v) && peek()&&peek().t==='('){ next(); const a=expr(); expect(')'); return {t:'call',f:p.v,a}; } return {t:'id',n:p.v}; }
    if(p.t==='('){ const a=expr(); expect(')'); return {t:'par',a}; }
    throw {msg:'« '+p.t+' » inattendu'}; }
  const left=expr(); let right=null;
  if(peek()&&peek().t==='='){ next(); right=expr(); }
  if(k<toks.length) throw {msg:'« '+(peek().v||peek().t)+' » inattendu'};
  if(!toks.length) throw {msg:'empty'};
  return {left,right};
}
function show(n){
  switch(n.t){
    case 'num': return String(n.v);
    case 'id': return n.n;
    case 'par': return '('+show(n.a)+')';
    case 'neg': return '-'+show(n.a);

    case 'pow': return show(n.a)+'^'+show(n.b);

function drawPlot(xs,ys,sg,a,b,xl,yl){

/* ================= Game layer ================= */
const XP_RATE={again:5,hard:10,good:15,easy:15};
const TASK_XP={serie:50,tp:60,autre:20};
const ONTIME_BONUS=20, PROBLEM_XP=10, DAY_XP=10, QUEST_XP=75;
const RANKS=['Quark','Électron','Atome','Molécule','Grain de poussière','Astéroïde','Lune','Planète','Étoile','Géante rouge','Pulsar','Trou noir','Galaxie','Amas de galaxies','Univers observable'];
function levelFor(xp){ let L=0; while(xp >= 50*(L+1)*(L+2)) L++; return L+1; }
function levelBounds(level){ return [50*(level-1)*level, 50*level*(level+1)]; }
const rankFor = lvl => RANKS[Math.min(lvl-1, RANKS.length-1)];
function weekStart(d){ const x=parseYmd(d); const back=(x.getDay()+6)%7; return addDays(d,-back); }
function reviewXP(h){ return Math.round((XP_RATE[h.r]||0)*(h.m==='full'?1.5:1)); }
function taskXP(x){ return (TASK_XP[x.type]||20) + (x.doneAt && x.doneAt<=x.due ? ONTIME_BONUS : 0); }

function questsFor(ws, ctx){
  const we=addDays(ws,6), inW=d=>d && d>=ws && d<=we;
  const tasksW=(S.settings.tasks||[]).filter(x=>inW(x.due));
  const doneW=tasksW.filter(x=>x.done).length;
  const rev=ctx.revByDay, add=ctx.addByDay;
  let nRev=0, nAdd=0, nDays=0;
  for(let i=0;i<7;i++){ const d=addDays(ws,i); nRev+=rev[d]||0; nAdd+=add[d]||0; if(ctx.activeDays.has(d)) nDays++; }
  return [
    {id:'series', label: tasksW.length? 'Rendre toutes tes séries et TP de la semaine' : 'Rendre tes séries de la semaine (aucune prévue)', cur:doneW, goal:Math.max(1,tasksW.length), done: tasksW.length>0 && doneW===tasksW.length},
    {id:'replay', label:'Refaire 5 problèmes', cur:Math.min(nRev,5), goal:5, done:nRev>=5},
    {id:'add', label:'Ajouter 3 problèmes ratés', cur:Math.min(nAdd,3), goal:3, done:nAdd>=3},
    {id:'days', label:'Être actif 4 jours', cur:Math.min(nDays,4), goal:4, done:nDays>=4}
  ];
}

function computeGame(){
  const c={}; courses().forEach(k=>c[k]=0);
  const add=(course,x)=>{ c[course]=(c[course]||0)+x; };
  const g={reviews:0, easy:0, full:0, added:0, seriesDone:0, onTime:0};
  const activeDays=new Set(), revByDay={}, addByDay={};
  for(const p of S.problems.values()){
    add(p.course, PROBLEM_XP); g.added++; if(p.created){ addByDay[p.created]=(addByDay[p.created]||0)+1; activeDays.add(p.created); }
    for(const h of (p.history||[])){ add(p.course, reviewXP(h)); g.reviews++; if(h.r==='easy') g.easy++; if(h.m==='full') g.full++; activeDays.add(h.d); revByDay[h.d]=(revByDay[h.d]||0)+1; }
  }
  if(typeof NB!=='undefined' && NB.ready){ for(const n of NB.nodes.values()){ if(n.type!=='note') continue; const c=nbCourseOf(n); if(!c) continue; add(c,5); if(n.created) activeDays.add(n.created); for(const st of (n.stamps||[])) if(st.t==='q'&&st.done) add(c,10); } }
  for(const x of (S.settings.tasks||[])){ if(!x.done) continue; add(x.course, taskXP(x)); g.seriesDone++; if(x.doneAt && x.doneAt<=x.due) g.onTime++; if(x.doneAt) activeDays.add(x.doneAt); }
  const ctx={activeDays, revByDay, addByDay};
  // quests: every week from the first activity to this week
  let questsDone=0; const t=today(); const thisWeek=weekStart(t);
  const firstDay=[...activeDays].sort()[0];
  if(firstDay){ for(let w=weekStart(firstDay); w<=thisWeek; w=addDays(w,7)) questsDone+=questsFor(w,ctx).filter(q=>q.done).length; }
  // streaks
  let best=0, run=0, prev=null; [...activeDays].sort().forEach(d=>{ run = (prev && diffDays(prev,d)===1) ? run+1 : 1; best=Math.max(best,run); prev=d; });
  let cur=0, d=t; if(!activeDays.has(d)) d=addDays(d,-1); while(activeDays.has(d)){ cur++; d=addDays(d,-1); }
  const bonus = activeDays.size*DAY_XP + questsDone*QUEST_XP;
  const courseXP=Object.values(c).reduce((a,b)=>a+b,0);
  const total = courseXP + bonus;
  const level=levelFor(total);
  const courseLv={}; for(const k in c) courseLv[k]=levelFor(c[k]);
  Object.assign(g,{courses:c, courseLv, total, level, rank:rankFor(level), questsDone, best, streak:cur, activeDays:activeDays.size, ctx, thisWeek});
  g.badges=BADGES.filter(b=>b.test(g)).map(b=>b.id);
  return g;
}

/* level-ups and new badges, announced once */
let progressBusy=false;
async function checkProgress(){
  if(!S.loaded || progressBusy) return; progressBusy=true;
  try{
    const g=computeGame(); const seen=S.settings.game;
    if(!seen){ S.settings.game={level:g.level, courseLv:g.courseLv, badges:g.badges}; await saveSettings(); return; }
    const msgs=[];
    if(g.level>seen.level) msgs.push({big:'Niveau '+g.level, small: rankFor(g.level)!==rankFor(seen.level) ? 'Tu deviens '+g.rank+' !' : 'Encore '+(levelBounds(g.level)[1]-g.total)+' XP pour le suivant'});
    for(const k in g.courseLv){ const before=(seen.courseLv||{})[k]||1; if(g.courseLv[k]>before) msgs.push({big:k+' niv. '+g.courseLv[k], small:'Ta stat monte !', color:courseColor(k)}); }
    const nb=g.badges.filter(b=>!(seen.badges||[]).includes(b));
    nb.forEach(id=>{ const b=BADGES.find(x=>x.id===id); msgs.push({big:'Badge : '+b.name, small:b.desc}); });
    const changed = g.level!==seen.level || nb.length || JSON.stringify(g.courseLv)!==JSON.stringify(seen.courseLv);
    if(changed){ S.settings.game={level:Math.max(g.level,seen.level), courseLv:g.courseLv, badges:[...new Set((seen.badges||[]).concat(g.badges))]}; await saveSettings(); }
    msgs.forEach((m,i)=>setTimeout(()=>celebrate(m), i*2600));
  } finally { progressBusy=false; }
}

const BMP={map:new Map(), px:0, LIMIT:42e6};
function bmpEvict(){ for(const [k,e] of BMP.map){ if(BMP.px<=BMP.LIMIT) break; if(!e.bmp) continue; BMP.map.delete(k); BMP.px-=e.px; try{ e.bmp.close(); }catch(_){} } }

}

/* pages nettes au zoom : rendu vectoriel à la demande */
const HIRES={map:new Map(), busy:false, queue:[]};
function hiresNow(it, wantPx, onReady){
  const k=it.pdf+'#'+it.pi; const e=HIRES.map.get(k);
  if(e && e.bmp && e.w>=wantPx*0.85){ HIRES.map.delete(k); HIRES.map.set(k,e); return e.bmp; }
  if(!HIRES.queue.find(q=>q.k===k)){ HIRES.queue.push({k, it, w:Math.min(4200,Math.round(wantPx*1.1)), onReady}); pumpHires(); }
  return e && e.bmp ? e.bmp : null;
}
async function pumpHires(){
  if(HIRES.busy) return; const job=HIRES.queue.pop(); HIRES.queue.length=0; if(!job) return; HIRES.busy=true;
  try{ const pdf=await pdfDocFor(job.it.pdf); const c=await pdfRenderCanvas(pdf, job.it.pi, job.w); const bmp=await createImageBitmap(c);
    const old=HIRES.map.get(job.k); if(old&&old.bmp) old.bmp.close();
    HIRES.map.set(job.k,{bmp, w:c.width}); while(HIRES.map.size>4){ const [k0,e0]=HIRES.map.entries().next().value; HIRES.map.delete(k0); e0.bmp&&e0.bmp.close(); }
    job.onReady&&job.onReady(); }
  catch(e){ console.warn('hires',e); }
  HIRES.busy=false; if(HIRES.queue.length) pumpHires();
}

/* ---------------- modèles de page ---------------- */
const TPLS=[['blank','Vierge'],['lines','Lignes'],['grid','Petits carreaux'],['seyes','Seyès'],['dots','Points'],['mm','Millimétré'],['cornell','Cornell']];
const PAGE_A4={w:1000,h:1414}, PAGE_GAP=36;
function drawTpl(ctx, tpl, R, s, vis, infinite){
  // R: rectangle monde de la page (ou de la zone visible en mode infini)

  const H=(step,col,off,from)=>{ if(step*s<3) return; ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.beginPath(); const base=oy+(off||0); let k=Math.ceil((Math.max(y0,from==null?-1e9:from)-base)/step); for(let y=base+k*step;y<=y1;y+=step){ ctx.moveTo(x0,y); ctx.lineTo(x1,y); } ctx.stroke(); };
  const V=(step,col,off,from)=>{ if(step*s<3) return; ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.beginPath(); const base=ox+(off||0); let k=Math.ceil((Math.max(x0,from==null?-1e9:from)-base)/step); for(let x=base+k*step;x<=x1;x+=step){ ctx.moveTo(x,y0); ctx.lineTo(x,y1); } ctx.stroke(); };
  const vline=(x,col,w)=>{ if(x<x0||x>x1) return; ctx.strokeStyle=col; ctx.lineWidth=(w||1.4)/s; ctx.beginPath(); ctx.moveTo(x,y0); ctx.lineTo(x,y1); ctx.stroke(); };
  const mm=4.76;
  switch(tpl){
    case 'lines': H(8*mm,'#c7d3ec',0,infinite?null:oy+24*mm); if(!infinite) vline(ox+25*mm,'#ef9aa0'); break;
    case 'grid': H(5*mm,'#d5def0'); V(5*mm,'#d5def0'); break;
    case 'seyes': H(2*mm,'#dde3f3'); H(8*mm,'#9fb1de'); V(8*mm,'#dde3f3'); if(!infinite) vline(ox+40*mm,'#ef9aa0'); break;
    case 'dots': { const st=5*mm; if(st*s<5) break; ctx.fillStyle='#b8c3dc'; const r=Math.max(0.9/s,0.9); let i0=Math.ceil((x0-ox)/st), j0=Math.ceil((y0-oy)/st);
      for(let x=ox+i0*st;x<=x1;x+=st) for(let y=oy+j0*st;y<=y1;y+=st) ctx.fillRect(x-r,y-r,2*r,2*r); break; }
    case 'mm': H(mm,'#f7d9c6'); V(mm,'#f7d9c6'); H(5*mm,'#efbd9c'); V(5*mm,'#efbd9c'); H(10*mm,'#e59a6c'); V(10*mm,'#e59a6c'); break;
    case 'cornell': if(infinite){ H(8*mm,'#c7d3ec'); break; } H(8*mm,'#c7d3ec',0,oy+30*mm); ctx.strokeStyle='#9fb1de'; ctx.lineWidth=1.6/s; ctx.beginPath();
      ctx.moveTo(Math.max(x0,ox),oy+26*mm); ctx.lineTo(Math.min(x1,ox+R.w),oy+26*mm); ctx.moveTo(ox+62*mm,Math.max(y0,oy+26*mm)); ctx.lineTo(ox+62*mm,Math.min(y1,oy+R.h-48*mm));
      ctx.moveTo(Math.max(x0,ox),oy+R.h-48*mm); ctx.lineTo(Math.min(x1,ox+R.w),oy+R.h-48*mm); ctx.stroke(); break;

/* ---------------- géométrie de l'encre ---------------- */
const OUTLINE=new WeakMap();
function strokeBox(st){

  const a=st.pts; let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(let i=0;i<a.length;i+=3){ const x=a[i],y=a[i+1]; if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  const m=st.size*0.8+1; const b=[x0-m,y0-m,x1+m,y1+m];
  c=c||{}; c.b=b; OUTLINE.set(st,c); return b;
}
/* contour à largeur variable (style « encre » lissée) */
function outlinePoints(a, size, penType, isPen){
  const pr=PENS[penType]||PENS.ball, n=a.length/3;

  const selEl=el('div',{class:'sel-box',style:{display:'none'}}); const handle=el('div',{class:'sel-handle',title:'Redimensionner'}); selEl.append(handle);

  return new Promise(res=>{ let close; const inp=el('input',{type:'text',value:value||''});
    const done=v=>{ close(); res(v); };
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') done(inp.value.trim()||null); });

async function saveBinary(name, mime, bytes){
  if(window.AndroidBridge && AndroidBridge.beginFile){
    if(!AndroidBridge.beginFile(name, mime)){ toast('Enregistrement impossible.','err'); return false; }
    const CH=3*65536;
    for(let i=0;i<bytes.length;i+=CH){ const part=bytes.subarray(i,i+CH); let s=''; for(let j=0;j<part.length;j+=8190) s+=String.fromCharCode.apply(null, part.subarray(j,j+8190));
      if(!AndroidBridge.appendBase64(btoa(s))){ toast('Enregistrement interrompu.','err'); return false; } }
    const ok=AndroidBridge.endFile(); toast(ok?'Enregistré dans Téléchargements : '+name:'Enregistrement impossible.', ok?'':'err'); return ok;
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([bytes],{type:mime})); a.download=name; document.body.append(a); a.click(); a.remove(); return true;
}
async function exportNotePdf(node){
  const pb=progressBox('Préparation du PDF…');
  try{
    const PDFLib=await loadScriptLib('lib/pdf-lib.min.js','PDFLib');
    const d=normalizeDoc(await nbGet('docs',node.id)); const out=await PDFLib.PDFDocument.create();
    let rects=[];
    if(d.mode==='pages') rects=d.items.filter(i=>i.kind==='page').sort((a,b)=>a.y-b.y).map(p=>({x:p.x,y:p.y,w:p.w,h:p.h}));
    else { const b=unionBox(d.strokes,d.items); if(b){ const pad=40, w=b.w+2*pad, ph=w*1.414; for(let y=b.y-pad;y<b.y+b.h+pad;y+=ph) rects.push({x:b.x-pad,y,w,h:ph}); } }
    if(!rects.length){ pb.close(); toast('Cette note est vide.','err'); return; }
    for(let i=0;i<rects.length;i++){
      const r=rects[i]; const blob=await renderRegion(d,r,1600,{noStamps:true,q:0.9,bg:'#ffffff'});
      const jpg=await out.embedJpg(new Uint8Array(await blob.arrayBuffer())); const pw=595.28, ph=pw*r.h/r.w;
      out.addPage([pw,ph]).drawImage(jpg,{x:0,y:0,width:pw,height:ph}); pb.set('Page '+(i+1)+' sur '+rects.length,(i+1)/rects.length);
    }
    out.setTitle(node.name); const bytes=await out.save(); pb.close();
    await saveBinary(safeName(node.name)+'.pdf','application/pdf',bytes);
  }catch(e){ pb.close(); console.warn(e); toast('Export impossible.','err'); }
}
async function duplicateNote(n){
  const d=await nbGet('docs',n.id)||{}; const map=new Map();
  for(const k of docBlobKeys(d)){ const b=await nbGet('blobs',k); if(b){ const nk=k.split(':')[0]+':'+uid(); await nbPut('blobs',b,nk); map.set(k,nk); } }
  const nd=clone(d); for(const it of (nd.items||[])) for(const f of ['img','lo','blob','pdf']) if(it[f]&&map.has(it[f])) it[f]=map.get(it[f]);
  const copy=await nbCreate('note',n.parent,n.name+' (copie)',{mode:n.mode, cover:n.cover, stamps:clone(n.stamps||[]), pages:n.pages});
  await nbPut('docs',nd,copy.id);
  if(n.thumb){ const b=await nbGet('blobs',n.thumb); if(b){ copy.thumb=await putBlob(b,'th:'); await nbSaveNode(copy); } }
  return copy;
}

    persistLocal();
    const nf=z.file('notes.json');
    if(nf){ const nj=JSON.parse(await nf.async('string'));
      await nbClear('nodes'); await nbClear('docs'); await nbClear('blobs'); NB.nodes.clear(); NB.urls.clear(); BMP.map.clear(); BMP.px=0;
      for(const n of nj.nodes||[]){ await nbPut('nodes',n); NB.nodes.set(n.id,n); }
      for(const [id,d] of Object.entries(nj.docs||{})) await nbPut('docs',d,id);
      for(const f of files) if(f.name.startsWith('blobs/')){ const k=decodeURIComponent(f.name.slice(6)); await nbPut('blobs', new Blob([await f.async('uint8array')],{type:k.startsWith('pdf:')?'application/pdf':'image/jpeg'}), k); i++; if(i%5===0) pb.set('Fichiers : '+i, Math.min(1,i/files.length)); }
    }
    pb.close(); render(); toast('Sauvegarde restaurée');
  }catch(e){ pb.close(); console.warn(e); toast('Ce fichier n’est pas une sauvegarde Replay valide.','err'); }
}

/* ---------------- écrans « Cours » ---------------- */
S.coursPath=null; S.coursTab='files'; S.coursSearch='';
function viewCours(){
  const root=el('div');
  if(!NB.ready){ root.append(el('div',{class:'card empty muted',text:'Ouverture de tes cours…'})); nbInit().then(()=>{ if(S.view==='cours') render(); }); return root; }
  if(S.coursPath && !nbIsRoot(S.coursPath) && !NB.nodes.has(S.coursPath)) S.coursPath=null;
  return S.coursPath ? coursFolder(root) : coursHome(root);
}
function notesList(){ return [...NB.nodes.values()].filter(n=>n.type==='note'); }
function coursHome(root){
  root.append(el('h2',{text:'Cours'}));
  const search=el('input',{type:'text',placeholder:'Chercher une note ou un dossier…',value:S.coursSearch});
  const body=el('div');
  const draw=()=>{ S.coursSearch=search.value; body.replaceChildren(); const q=search.value.trim().toLowerCase();
    if(q){ const hits=[...NB.nodes.values()].filter(n=>n.name.toLowerCase().includes(q)).sort((a,b)=>(b.updated||0)-(a.updated||0));
      body.append(hits.length? nodeGrid(hits,true) : el('p',{class:'muted',text:'Rien trouvé pour « '+search.value+' ».'})); return; }
    const favs=notesList().filter(n=>n.fav).sort((a,b)=>(b.updated||0)-(a.updated||0));
    const recent=notesList().sort((a,b)=>(b.updated||0)-(a.updated||0)).slice(0,6);
    if(favs.length) body.append(el('h3',{class:'sec-h',text:'Favoris'}), nodeGrid(favs,true));
    if(recent.length) body.append(el('h3',{class:'sec-h',text:'Récents'}), nodeGrid(recent,true));
    body.append(el('h3',{class:'sec-h',text:'Mes cours'}), courseGrid()); };
  search.addEventListener('input',draw);
  root.append(el('div',{style:{marginBottom:'14px'}},search), body); draw();
  return root;
}
function courseGrid(){
  return el('div',{class:'course-grid'}, courses().map(c=>{
    const n=nbNoteCount(c), q=nbStampsOf(c,'q').filter(x=>!x.s.done).length;
    const card=el('button',{type:'button',class:'course-card',onclick:()=>{ S.coursPath='c:'+c; S.coursTab='files'; render(); window.scrollTo(0,0); }},
      el('div',{class:'cc-name',text:c}), el('div',{class:'muted small',text:n+' note'+(n>1?'s':'')}), q? el('div',{class:'cc-q hand',text:q+' ? à revoir'}):'');
    card.style.setProperty('--cc',courseColor(c)); return card; }));
}
function crumbs(){
  const parts=[]; let p=S.coursPath, g=0;
  while(p && !nbIsRoot(p) && g++<60){ const n=NB.nodes.get(p); if(!n) break; parts.unshift(n); p=n.parent; }
  const course=nbIsRoot(p)?p.slice(2):'';
  const bc=el('div',{class:'crumbs'}, el('button',{type:'button',class:'crumb',text:'Cours',onclick:()=>{ S.coursPath=null; render(); }}), el('span',{class:'muted',text:'›'}),
    el('button',{type:'button',class:'crumb',text:shortCourse(course),onclick:()=>{ S.coursPath='c:'+course; render(); }}));
  parts.forEach(n=>bc.append(el('span',{class:'muted',text:'›'}), el('button',{type:'button',class:'crumb',text:n.name,onclick:()=>{ S.coursPath=n.id; render(); }})));
  return {el:bc, course};
}
function newNoteDialog(parent){
  let close, mode='pages', tpl='grid', orient='port', cover=COVERS[0];
  const name=el('input',{type:'text',value:dateName()});
  const tplBox=el('div',{class:'tpl-grid'});
  const drawT=()=>{ tplBox.replaceChildren(...TPLS.map(([id,label])=>{ const c=el('canvas',{width:96,height:120,class:'tpl-c'}); const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,96,120); x.setTransform(0.096,0,0,0.0849,0,0); drawTpl(x,id,{x:0,y:0,w:1000,h:1414},0.2,[0,0,1000,1414],false);
    return el('button',{type:'button',class:'tpl'+(id===tpl?' on':''),onclick:()=>{ tpl=id; drawT(); }}, c, el('span',{class:'small',text:label})); })); };
  const modeSeg=el('div',{class:'seg'}); const drawM=()=>{ modeSeg.replaceChildren(...[['pages','Cahier (pages)'],['infinite','Tableau infini']].map(([v,l])=>el('button',{type:'button',class:mode===v?'on':'',text:l,onclick:()=>{ mode=v; drawM(); orientRow.style.display=mode==='pages'?'':'none'; }}))); };
  const orientSeg=el('div',{class:'seg'}); const drawO=()=>{ orientSeg.replaceChildren(...[['port','Portrait'],['land','Paysage']].map(([v,l])=>el('button',{type:'button',class:orient===v?'on':'',text:l,onclick:()=>{ orient=v; drawO(); }}))); };
  const orientRow=el('div',{}, el('label',{class:'f',text:'Format'}), orientSeg);
  const covers=el('div',{class:'swatches'}); const drawC=()=>{ covers.replaceChildren(...COVERS.map(c=>el('button',{type:'button',class:'swatch'+(c===cover?' on':''),style:{background:c},'aria-label':'Couverture',onclick:()=>{ cover=c; drawC(); }}))); };
  drawT(); drawM(); drawO(); drawC();
  close=modal(el('div',{}, el('h2',{text:'Nouvelle note'}),
    el('label',{class:'f',text:'Nom'}), name, el('label',{class:'f',text:'Type'}), modeSeg, orientRow,
    el('label',{class:'f',text:'Modèle de page'}), tplBox, el('label',{class:'f',text:'Couverture'}), covers,
    el('div',{class:'row',style:{marginTop:'18px'}}, el('span',{class:'spacer'}), el('button',{class:'btn ghost',type:'button',text:'Annuler',onclick:()=>close()}),
      el('button',{class:'btn primary',type:'button',text:'Créer',onclick:async()=>{ const v=name.value.trim()||dateName(); close(); const n=await createNote(parent,v,{mode,tpl,orient,cover}); openNote(n.id); }}))));
}
function coursFolder(root){
  const {el:bc, course}=crumbs(); root.append(bc);
  const atRoot=nbIsRoot(S.coursPath);
  const title=atRoot?course:(NB.nodes.get(S.coursPath)||{}).name;
  const h=el('h2',{text:title,class:'nb-title'}); h.style.setProperty('--cc',courseColor(course)); root.append(h);
  if(atRoot){
    const nQ=nbStampsOf(course,'q').filter(x=>!x.s.done).length, nS=nbStampsOf(course,'star').length, nF=nbStampsOf(course,'f').length;
    const seg=el('div',{class:'seg',style:{marginBottom:'16px'}});
    [['files','Fichiers'],['q','? À revoir'+(nQ?' ('+nQ+')':'')],['star','★ Important'+(nS?' ('+nS+')':'')],['f','ƒ Formules'+(nF?' ('+nF+')':'')]].forEach(([id,l])=>seg.append(el('button',{class:S.coursTab===id?'on':'',text:l,onclick:()=>{ S.coursTab=id; render(); }})));
    root.append(seg);
    if(S.coursTab!=='files'){ root.append(stampList(course, S.coursTab)); return root; }
  }
  const parent=S.coursPath;
  const pdfIn=el('input',{type:'file',accept:'application/pdf,.pdf',style:{display:'none'}});
  const imgIn=el('input',{type:'file',accept:'image/*',style:{display:'none'}});
  pdfIn.addEventListener('change',async()=>{ const f=pdfIn.files[0]; pdfIn.value=''; if(!f) return;
    const pages=await pdfToPages(f); if(!pages.length) return;
    let y=0; for(const pg of pages){ pg.x=0; pg.y=y; y+=pg.h+PAGE_GAP; }
    const n=await nbCreate('note',parent,f.name.replace(/\.pdf$/i,''),{mode:'pages', cover:COVERS[5], pages:pages.length});
    await nbPut('docs',{v:2, mode:'pages', tpl:'grid', strokes:[], items:pages, view:null},n.id); openNote(n.id); });
  imgIn.addEventListener('change',async()=>{ const f=imgIn.files[0]; imgIn.value=''; if(!f) return;
    let blob; try{ blob=await recompress(f,2200,0.88,'image/jpeg'); }catch(e){ blob=f; }
    const bmp=await createImageBitmap(blob).catch(()=>null); const ar=bmp?bmp.height/bmp.width:1.3; if(bmp) bmp.close(); const key=await putBlob(blob);
    const n=await nbCreate('note',parent,'Photo du '+fmtDate(today()),{mode:'pages'});
    await nbPut('docs',{v:2, mode:'pages', tpl:'blank', strokes:[], items:[{id:uid(),kind:'page',x:0,y:0,w:1000,h:Math.round(1000*ar),img:key,tpl:'blank'}], view:null},n.id); openNote(n.id); });
  const sortSeg=el('div',{class:'seg seg-sm'}, [['recent','Récents'],['name','A → Z']].map(([v,l])=>el('button',{type:'button',class:(S.settings.nbSort||'recent')===v?'on':'',text:l,onclick:()=>{ S.settings.nbSort=v; saveSettings(); render(); }})));
  const viewSeg=el('div',{class:'seg seg-sm'}, [['grid','Grille'],['list','Liste']].map(([v,l])=>el('button',{type:'button',class:(S.settings.nbView||'grid')===v?'on':'',text:l,onclick:()=>{ S.settings.nbView=v; saveSettings(); render(); }})));
  root.append(el('div',{class:'row',style:{marginBottom:'16px'}},
    el('button',{class:'btn primary',type:'button',text:'＋ Note',onclick:()=>newNoteDialog(parent)}),
    el('button',{class:'btn',type:'button',text:'＋ Dossier',onclick:async()=>{ const v=await promptBox('Nom du dossier','Nouveau dossier'); if(!v) return; await nbCreate('folder',parent,v); render(); }}),
    el('button',{class:'btn',type:'button',text:'Importer un PDF',onclick:()=>pdfIn.click()}),
    el('button',{class:'btn ghost',type:'button',text:'Photo',onclick:()=>imgIn.click()}), pdfIn, imgIn,
    el('span',{class:'spacer'}), sortSeg, viewSeg));
  const kids=nbChildren(parent);
  root.append(kids.length? nodeGrid(kids,false)
    : el('div',{class:'card empty muted',text: atRoot?'Aucune note pour l’instant. Crée un cahier pour ton prochain cours, ou importe le PDF du polycopié pour l’annoter.':'Ce dossier est vide.'}));
  return root;
}
function nodeGrid(list, showCourse){ const list2=S.settings.nbView==='list'; return el('div',{class:list2?'nb-list':'nb-grid'}, list.map(n=>nodeTile(n,showCourse))); }
function nodeTile(n, showCourse){
  const isF=n.type==='folder', c=nbCourseOf(n);
  let thumb;
  if(isF) thumb=el('div',{class:'nb-folder'}, el('span',{text:String(nbChildren(n.id).length)}));
  else { thumb=el('div',{class:'nb-cover'+(n.mode==='infinite'?' board':'')}, el('div',{class:'nb-page'})); if(n.cover) thumb.style.setProperty('--cover',n.cover);
    if(n.thumb) nbBlobURL(n.thumb).then(u=>{ if(u) thumb.firstChild.append(el('img',{src:u,alt:'',loading:'lazy'})); }); }
  const q=(n.stamps||[]).filter(s=>s.t==='q'&&!s.done).length;
  const meta=[]; if(showCourse&&c) meta.push(shortCourse(c)); meta.push(fmtDate(ymd(new Date(n.updated||Date.now())))); if(!isF && n.pages>1) meta.push(n.pages+' p.'); if(q) meta.push(q+' ?');
  const tile=el('div',{class:'nb-tile'+(isF?' is-folder':''),role:'button',tabindex:'0',onclick:()=>{ if(isF){ S.coursPath=n.id; render(); window.scrollTo(0,0); } else openNote(n.id); }},
    thumb, n.fav?el('span',{class:'nb-fav',text:'★','aria-label':'Favori'}):'',
    el('div',{class:'nb-meta'}, el('div',{class:'nb-name',text:n.name}), el('div',{class:'muted small',text:meta.join(' · ')})),
    el('button',{type:'button',class:'nb-more','aria-label':'Options',onclick:e=>{ e.stopPropagation(); nodeMenu(n); }},'⋯'));
  tile.addEventListener('keydown',e=>{ if(e.key==='Enter') tile.click(); });
  if(c) tile.style.setProperty('--cc',courseColor(c));
  return tile;
}
function nodeMenu(n){
  let close; const isNote=n.type==='note';
  const covers=isNote? el('div',{class:'swatches',style:{marginTop:'6px'}}, COVERS.map(c=>el('button',{type:'button',class:'swatch'+(c===n.cover?' on':''),style:{background:c},'aria-label':'Couverture',onclick:async()=>{ n.cover=c; await nbSaveNode(n,true); close(); render(); }}))):'';
  close=modal(el('div',{}, el('h3',{text:n.name}),
    el('div',{class:'menu-col'},
      el('button',{class:'btn',type:'button',text:'Renommer',onclick:async()=>{ close(); const v=await promptBox('Nouveau nom',n.name); if(v){ n.name=v; await nbSaveNode(n); render(); } }}),
      el('button',{class:'btn',type:'button',text:'Déplacer',onclick:()=>{ close(); moveDialog(n); }}),
      isNote? el('button',{class:'btn',type:'button',text:n.fav?'Retirer des favoris':'Ajouter aux favoris',onclick:async()=>{ n.fav=!n.fav; await nbSaveNode(n,true); close(); render(); }}):'',
      isNote? el('button',{class:'btn',type:'button',text:'Dupliquer',onclick:async()=>{ close(); await duplicateNote(n); toast('Note dupliquée'); render(); }}):'',
      isNote? el('button',{class:'btn',type:'button',text:'Exporter en PDF',onclick:()=>{ close(); exportNotePdf(n); }}):'',
      el('button',{class:'btn danger ghost',type:'button',text:'Supprimer',onclick:async()=>{ close();
        const msg=n.type==='folder'?'Supprimer le dossier « '+n.name+' » et tout ce qu’il contient ?':'Supprimer la note « '+n.name+' » ?';
        if(await confirmBox(msg,'Supprimer')){ await nbDeleteNode(n.id); toast('Supprimé'); render(); } }})),
    isNote? el('div',{}, el('label',{class:'f',text:'Couverture'}), covers):'',
    el('div',{class:'row',style:{marginTop:'14px'}}, el('span',{class:'spacer'}), el('button',{class:'btn ghost',type:'button',text:'Fermer',onclick:()=>close()}))));
}
function moveDialog(n){
  const banned=new Set([n.id, ...nbDescendantIds(n.id)]); let close;
  const list=el('div',{class:'move-list'});
  const add=(id,label,depth,color)=>{ const b=el('button',{type:'button',class:'move-row'+(n.parent===id?' here':''),style:{paddingLeft:(14+depth*22)+'px'},onclick:async()=>{ n.parent=id; await nbSaveNode(n); close(); toast('Déplacé'); render(); }}, label); if(color) b.style.setProperty('--cc',color); list.append(b); };
  const walk=(p,depth)=>{ for(const c of nbChildren(p)) if(c.type==='folder' && !banned.has(c.id)){ add(c.id,'▸ '+c.name,depth); walk(c.id,depth+1); } };
  courses().forEach(c=>{ add('c:'+c, c, 0, courseColor(c)); walk('c:'+c,1); });
  close=modal(el('div',{}, el('h3',{text:'Déplacer « '+n.name+' » vers…'}), list, el('div',{class:'row',style:{marginTop:'12px'}}, el('span',{class:'spacer'}), el('button',{class:'btn ghost',type:'button',text:'Annuler',onclick:()=>close()}))));
}
const snapCache=new Map();
function stampList(course, type){
  const list=nbStampsOf(course,type).sort((a,b)=> type==='q' ? (a.s.done-b.s.done)||((b.node.updated||0)-(a.node.updated||0)) : 0);
  if(!list.length) return el('div',{class:'card empty muted',text: type==='q'?'Aucun passage marqué « pas compris ». Pendant le cours, pose un tampon ? dans la marge quand tu décroches.':type==='star'?'Aucun passage important marqué. Utilise le tampon ★ quand le prof insiste sur un point.':'Aucune formule marquée. Pose un tampon ƒ à côté des formules clés : elles apparaîtront toutes ici.'});
  const box=el('div',{class:'stamp-list'});
  for(const {node,s} of list){
    const img=el('div',{class:'st-snap'}); const key=node.id+':'+s.id+':'+node.updated;
    const fill=u=>img.replaceChildren(el('img',{src:u,alt:''}));
    if(snapCache.has(key)) fill(snapCache.get(key));
    else nbGet('docs',node.id).then(async d=>{ if(!d) return; const b=await renderRegion(normalizeDoc(d), stampRect(s), 760, {noStamps:false}); const u=URL.createObjectURL(b); snapCache.set(key,u); fill(u); });
    const st=STAMP[s.t]||STAMP.q;
    box.append(el('div',{class:'card st-row'+(s.done?' done':'')},
      el('div',{class:'row',style:{marginBottom:'8px'}}, el('span',{class:'stamp-ic',style:{background:s.done?'#1d8a4e':st.color},text:s.done?'✓':st.label}), el('b',{text:node.name}), el('span',{class:'muted small',text:fmtDate(ymd(new Date(node.updated||Date.now())))})),
      img,
      el('div',{class:'row',style:{marginTop:'10px'}},
        el('button',{class:'btn small',type:'button',text:'Ouvrir',onclick:()=>openNote(node.id,{x:s.x,y:s.y})}),
        type==='q'? el('button',{class:'btn small',type:'button',text:s.done?'Pas résolu':'Résolu ✓',onclick:()=>setStampDone(node,s.id,!s.done)}):'',
        el('button',{class:'btn small ghost',type:'button',text:'→ Carnet Replay',onclick:async()=>{ const d=await nbGet('docs',node.id); if(d) await sendRegionToReplay(node,normalizeDoc(d),stampRect(s)); }}))));
  }
  return box;
}
async function setStampDone(node, sid, done){
  const d=await nbGet('docs',node.id); if(!d) return;
  d.items=(d.items||[]).map(i=>i.id===sid?Object.assign({},i,{done}):i);
  await nbPut('docs',d,node.id);
  node.stamps=(node.stamps||[]).map(s=>s.id===sid?Object.assign({},s,{done}):s);
  await nbSaveNode(node); if(done) xpToast(10, nbCourseOf(node)||'Cours'); render();
}
