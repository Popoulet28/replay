name: Construire l'APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Construire
        run: |
          chmod +x gradlew
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk Replay.apk

      - uses: actions/upload-artifact@v5
        with:
          name: Replay-apk
          path: Replay.apk

      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" Replay.apk \
            --title "Replay ${{ github.run_number }}" \
            --notes "Télécharge Replay.apk et installe-le sur ta tablette." \
            --latest
